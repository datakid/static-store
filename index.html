<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="description" content="App downloads, every version.">
<title>Shelf</title>
<script>document.documentElement.dataset.theme=localStorage.theme||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light')</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500&family=Geist:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="top">
  <a class="mark" href="#/"></a>
  <button id="theme" aria-label="Toggle theme"></button>
</header>
<main>
  <section class="find">
    <label class="search">
      <input id="q" type="search" placeholder="Search" autocomplete="off" spellcheck="false" aria-label="Search apps, versions, platforms">
      <kbd>/</kbd>
    </label>
    <div class="bar">
      <div id="plats" class="chips" role="group" aria-label="Platform"></div>
      <span id="count" class="label"></span>
    </div>
  </section>
  <ol id="list" class="list"></ol>
  <p id="empty" class="empty" hidden>Nothing matches.</p>
</main>
<footer>
  <span>Releases sync from GitHub</span>
  <span id="sync"></span>
</footer>
<script src="js/apps.js"></script>
<script src="js/main.js"></script>
</body>
</html>
