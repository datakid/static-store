<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f3efe3" media="(prefers-color-scheme:light)">
<meta name="theme-color" content="#1e1823" media="(prefers-color-scheme:dark)">
<meta name="description" content="App downloads, every version.">
<title>Shelf</title>
<link id="icon" rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="manifest" href="manifest.webmanifest">
<script>try{var t=localStorage.theme;if(t==='light'||t==='dark')document.documentElement.dataset.theme=t}catch(e){}</script>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="top">
  <a class="mark" href="#/">
    <svg viewBox="5 8 22 19" aria-hidden="true"><rect class="i" x="8" y="9" width="4" height="13.5" rx="1.2"/><rect class="a" x="13.5" y="12" width="4" height="10.5" rx="1.2"/><rect class="i" x="20.5" y="10" width="4" height="12.5" rx="1.2" transform="rotate(-12 20.5 22.5)"/><rect class="i" x="6" y="23.5" width="20" height="2.5" rx="1.25"/></svg>
    <span id="site">Shelf</span>
  </a>
  <button id="theme"></button>
</header>
<main aria-busy="true">
  <section class="find">
    <label class="search">
      <input id="q" type="search" placeholder="Search" autocomplete="off" spellcheck="false" aria-label="Search apps, versions, platforms">
      <kbd>/</kbd>
    </label>
    <div class="bar">
      <div id="plats" class="chips" role="group" aria-label="Platform"></div>
      <span id="count" class="label"></span>
    </div>
    <div class="sense">
      <button id="detect" aria-pressed="false" aria-describedby="sense">Detect my system</button>
      <p id="sense"></p>
    </div>
  </section>
  <ol id="list" class="list"></ol>
  <p id="empty" class="empty" hidden></p>
</main>
<footer>
  <span>Releases from GitHub</span>
  <span id="sync"></span>
</footer>
<script src="js/apps.js"></script>
<script src="js/main.js"></script>
</body>
</html>
